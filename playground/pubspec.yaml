name: playground
description: Demo app — showcases dartnative on iOS with all demo screens.
publish_to: 'none'
version: 0.1.0+1


environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  dartnative: ^1.0.0
  # Platform bindings — iOS uses dartnative_ios, Android uses dartnative_android.
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0
  # ── Storage plugins ──────────────────────────────────────────────────────
  dartnative_sqlite: ^1.0.0
  dartnative_shared_preferences: ^1.0.0
  dartnative_secure_storage: ^1.0.0
  dartnative_hive: ^1.0.0
  dartnative_path_provider: ^1.0.0
  dartnative_system: ^1.0.0
  dartnative_connectivity: ^1.0.0
  dartnative_social_sign_in: ^1.0.0
  dartnative_firebase: ^1.0.0
  dartnative_notifications: ^1.0.0
  dartnative_media_picker: ^1.1.0
  # ── Media tab plugins ─────────────────────────────────────────────────────
  dartnative_video_player: ^1.0.0
  dartnative_audio: ^1.0.0
  dartnative_permissions: ^1.0.0
  dartnative_camera: ^1.0.0
  # Camera example extras: shutter/rec sound cues, photo aspect-crop, video thumb.
  dartnative_image_crop: ^1.0.0
  dartnative_compressor: ^1.0.0
  # SuperTonic on-device TTS (pulls dartnative_onnxruntime transitively).
  dartnative_supertonic_tts: ^1.0.0
  # Lottie via Skottie (requires the skia `full` or `lottie` variant — see above).
  dartnative_lottie: ^1.0.0
  dartnative_splash: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0


# ── dartnative_skia tier ─────────────────────────────────────────────────────
# One line picks which Skia binary ships with the app. The iOS Podfile and
# (once implemented) the Android Gradle plugin read this key and link the
# matching pre-built archive. See the Skia doc, section 1.3, for the tier matrix.
#   bare    7.8 MB   shapes, gradients, SkSL, images
#   text   20 MB    + HarfBuzz + SkParagraph  (default)
#   lottie 15 MB    + Skottie
#   full   27 MB    bare + text + lottie
dartnative_skia:
  variant: full

dartnative:
  uses-material-design: false

  assets:
    - assets/apple-logo.png
    - assets/google-logo.png
    - assets/avatar.jpg
    - assets/dn-logo.png
    - assets/backdrop_filter_sample.jpg
    - assets/hero_demo.jpg
    # Media tab — audio demo sample + SuperTonic bundled-model slots
    # (the supertonic dir ships ~empty; models download on first launch).
    - assets/audio/
    # Media tab — camera demo shutter / start-rec / stop-rec sound cues.
    - assets/audios/camera/
    - assets/supertonic/
    - assets/supertonic/voice_styles/
    # Graphics tab — Lottie demos (Skottie): control animations + sticker grid.
    - assets/animations/
    - assets/lotties/
    # Showcase tab — Music demo: album artwork + playable tracks.
    - assets/music/covers/
    - assets/music/tracks/
    # Carousel demo (Showcase tab): album artwork.
    - assets/carousel/covers/

# ── dartnative_splash ─────────────────────────────────────────────────────────
# Build-time splash screen generator.
# Run:  dart run dartnative_splash:setup
# The Android 12 safe-zone (logo ≤ 760 px within 1200×1200 canvas) is enforced
# automatically by the image processor.
dartnative_splash:
  background_color: "#000000"
  image: assets/dn-logo.png
  android: true
  ios: true

