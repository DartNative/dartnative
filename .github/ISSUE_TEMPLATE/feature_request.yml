name: Request a feature
description: Something DartNative or a first-party plugin should be able to do.
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for using DartNative!

        Support follows your plan: Community requests get basic support,
        Standard requests priority support, Pro requests the highest priority.
        We don't verify the plan at submission time.

        **Include a public repo we can clone and run.** We do not scaffold
        projects or debug from snippets.

        Before filling the form:

        - Search the [existing feature requests](https://github.com/DartNative/dartnative/issues?q=is%3Aissue+label%3Afeature)
        - Check the [documentation](https://dartnative.com/docs)

  - type: dropdown
    id: plan
    attributes:
      label: Select your plan
      description: Support follows the plan your license is on.
      options:
        - Community - basic support
        - Standard - priority support
        - Pro - highest priority support
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing feature requests and this is not a duplicate.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Framework or plugin?
      options:
        - Framework
        - Plugin
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform is this for?
      options:
        - iOS
        - Android
        - Both
        - Not platform-specific
      default: 2
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: >
        Tell us the problem you are running into that led to you wanting a
        new feature. What are you building, and what's in the way? Describe
        the alternatives you've considered — is there a plugin on dartpub.dev
        that already solves this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        Briefly but precisely describe what you would like DartNative to be
        able to do. Attach anything that shows what you are imagining —
        images, videos, code samples. If this could live in a plugin rather
        than the framework, consider building and publishing one on
        dartpub.dev.
    validations:
      required: true
