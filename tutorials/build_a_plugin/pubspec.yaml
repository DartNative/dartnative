name: build_a_plugin
description: DartNative tutorial — build a plugin (dartnative_share, from scratch).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

# Consumer-shaped dependencies: `dn pub get` fetches the prebuilt dartnative
# packages from dartpub.dev (no pub registry, no token needed to build).
dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_share: ^1.0.0
  dartnative_media_picker: ^1.0.0
  dartnative_compressor: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
