name: code_push_tutorial
description: DartNative tutorial — code push. Ship a mistake, send a fix, watch the phone correct itself.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Consumer-shaped dependencies: `dn pub get` fetches the prebuilt dartnative
# packages from dartpub.dev (no pub registry, no token needed to build).
dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0

# `dn release` adds a `dartnative: assets:` entry here for the small settings
# file it writes, so the installed app carries it and knows where to ask
# about fixes. Leave that entry in once it appears.
