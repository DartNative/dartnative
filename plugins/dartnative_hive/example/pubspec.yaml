name: dartnative_hive_example
description: Example app for dartnative_hive — a persistent Hive box opened at the framework documents path.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0
  dartnative_splash: ^1.0.0
  dartnative_hive: ^1.0.0
  dartnative_path_provider: ^1.0.0
  # The documents-path helper resolves DNGetDocumentsDirectory over FFI.
  ffi: ^2.1.4

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0

dartnative_skia:
  variant: full

dartnative_splash:
  background_color: "#000000"
  image: assets/dn-logo.png
  ios: true
  android: true

dartnative:
  assets:
    - assets/dn-logo.png
