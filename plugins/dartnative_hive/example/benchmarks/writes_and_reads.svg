<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="488" viewBox="0 0 1240 488" role="img" aria-labelledby="title description">
  <title id="title">Hive Writes and Reads: iPhone 16 Pro</title>
  <desc id="description">Elapsed-time comparison of hive_ce and dartnative_hive across 4 cases. Lower is better.</desc>
  <rect width="1240" height="488" fill="#0d1117"/>
  <rect x="28" y="24" width="1184" height="440" rx="18" fill="#161b22" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="66.0" y="77" fill="#f0f6fc" font-size="27" font-weight="700">Hive Writes and Reads: iPhone 16 Pro</text>
    <text x="67.0" y="108" fill="#8b949e" font-size="14">Profile builds - 1,000 operations per bar - median of 7 rounds - lower is better</text>
    <rect x="66.0" y="138" width="15" height="15" rx="3" fill="#f59e0b"/>
    <text x="89.0" y="151" fill="#e6edf3" font-size="13">hive_ce (Flutter)</text>
    <rect x="233.0" y="138" width="15" height="15" rx="3" fill="#10b981"/>
    <text x="256.0" y="151" fill="#e6edf3" font-size="13">dartnative_hive</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="282.0" y="208.0" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="end">Write, 1 key</text>
    <rect x="300.0" y="188.0" width="692.0" height="12.0" rx="4" fill="#f59e0b"/>
    <text x="1000.0" y="198.0" fill="#fde68a" font-size="11" font-weight="600" text-anchor="start">33.10 ms</text>
    <rect x="300.0" y="204.0" width="15.8" height="12.0" rx="4" fill="#10b981"/>
    <text x="323.8" y="214.0" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="start">0.757 ms</text>
    <text x="1182.0" y="206.0" fill="#a7f3d0" font-size="15" font-weight="700" text-anchor="end">43.7x faster</text>
    <text x="282.0" y="262.0" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="end">Write, 1000 keys</text>
    <rect x="300.0" y="242.0" width="692.0" height="12.0" rx="4" fill="#f59e0b"/>
    <text x="1000.0" y="252.0" fill="#fde68a" font-size="11" font-weight="600" text-anchor="start">23.44 ms</text>
    <rect x="300.0" y="258.0" width="46.2" height="12.0" rx="4" fill="#10b981"/>
    <text x="354.2" y="268.0" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="start">1.56 ms</text>
    <text x="1182.0" y="260.0" fill="#a7f3d0" font-size="15" font-weight="700" text-anchor="end">15.0x faster</text>
    <text x="282.0" y="316.0" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="end">Read, 1 key</text>
    <rect x="300.0" y="296.0" width="692.0" height="12.0" rx="4" fill="#f59e0b"/>
    <text x="1000.0" y="306.0" fill="#fde68a" font-size="11" font-weight="600" text-anchor="start">0.032 ms</text>
    <rect x="300.0" y="312.0" width="475.7" height="12.0" rx="4" fill="#10b981"/>
    <text x="783.8" y="322.0" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="start">0.022 ms</text>
    <text x="1182.0" y="314.0" fill="#a7f3d0" font-size="15" font-weight="700" text-anchor="end">1.5x faster</text>
    <text x="282.0" y="370.0" fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="end">Read, 1000 keys</text>
    <rect x="300.0" y="350.0" width="692.0" height="12.0" rx="4" fill="#f59e0b"/>
    <text x="1000.0" y="360.0" fill="#fde68a" font-size="11" font-weight="600" text-anchor="start">0.336 ms</text>
    <rect x="300.0" y="366.0" width="624.0" height="12.0" rx="4" fill="#10b981"/>
    <text x="932.0" y="376.0" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="start">0.303 ms</text>
    <text x="1182.0" y="368.0" fill="#a7f3d0" font-size="15" font-weight="700" text-anchor="end">1.1x faster</text>
  </g>
  <text x="66.0" y="420.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">hive_ce: version 2.20.1 from pub.dev, in a Flutter app. dartnative_hive: in a DartNative app. The same device.</text>
  <text x="66.0" y="439.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Each bar is 1000 operations on a short string: awaited puts on 1 key or on 1000 keys, then a get of each.</text>
</svg>
