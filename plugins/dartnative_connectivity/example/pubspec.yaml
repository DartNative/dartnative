name: dartnative_connectivity_example
description: "Example app for dartnative_connectivity — internet reachability + network type."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0
  dartnative_splash: ^1.0.0
  dartnative_connectivity: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0

dartnative_skia:
  variant: full

dartnative:
  assets:
    - assets/dn-logo.png

# Branded launch splash + app icon. Replace assets/dn-logo.png with your logo, then:
#   dart run tool/generate_app_assets.dart --source=assets/dn-logo.png --bg=#000000
# (Splash only: dart run dartnative_splash:setup)
dartnative_splash:
  background_color: "#000000"
  image: assets/dn-logo.png
  ios: true
  android: true
