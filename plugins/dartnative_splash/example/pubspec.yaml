name: splash_example
description: >
  Example for dartnative_splash. Shows the generated native splash screen,
  then lands on a bare welcome screen. Run `dart run dartnative_splash:setup`
  to (re)generate the splash assets from the config block below.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  # Build-time tool under test — provides `dart run dartnative_splash:setup`.
  dartnative_splash: ^1.0.0

dartnative_skia:
  variant: full

# Consumed by `dart run dartnative_splash:setup` to generate the native
# iOS + Android splash assets (including the Android 12 SplashScreen API).
dartnative_splash:
  background_color: "#000000"
  image: assets/dn-logo.png
  android: true
  ios: true

dartnative:
  assets:
    - assets/dn-logo.png
