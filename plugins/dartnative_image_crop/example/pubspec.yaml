publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_image_crop: ^1.0.0
