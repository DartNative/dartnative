name: dartnative_keys_example
description: Example app for dartnative_keys — load publishable keys from a bundled .dnkeys.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0-0

dependencies:
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0
  dartnative_splash: ^1.0.0
  dartnative_keys: ^1.0.0

dev_dependencies:
  lints: ^6.0.0
  image: ^4.0.0

dartnative_skia:
  variant: full

dartnative_splash:
  background_color: "#000000"
  image: assets/dn-logo.png
  ios: true
  android: true

dartnative:
  assets:
    - assets/dn-logo.png
    # The bundled keys file DnKeys.load() reads at runtime.
    - .dnkeys
