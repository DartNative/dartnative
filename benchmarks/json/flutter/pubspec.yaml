name: json_flutter
description: "The JSON benchmark, Flutter side: Flutter's own routes from bytes, or a URL, to Dart objects."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cronet_http: ^1.10.0
  cupertino_http: ^3.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
